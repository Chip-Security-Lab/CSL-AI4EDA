    requirement:{zh:'依据 PowerSecV 第 IV.D 节图 4(b)，生成 Verilog-2005 模块 csr_access_secure。输入 clk、低有效异步复位 rst_n、csr_we、current_priv[1:0]、csr_addr[11:0]、write_data[31:0]；输出 csr_rdata[31:0]、illegal_access、power_signature。存储为 128×32 位 csr_mem，索引使用 csr_addr[6:0]；权限条件为 current_priv >= csr_addr[11:10]。每个写请求仅在权限允许时更新 CSR，拒绝请求禁止写入并置 illegal_access，非请求周期清标志；每个合法或非法写请求均更新 mask_0 = write_data XOR 32\'hA3EF63B2，power_signature 为 mask_0 的归约异或。复位清零存储、辅助寄存器和标志；组合读仅在当前权限允许时返回对应 CSR，否则返回零。复位与读口为补全接口的明确假设。后续独立低功耗版允许增加一周期提交延迟，必须同时缓冲数据、地址、授权和有效位，权限在请求接收时采样并只用于该事务。不得把固定 XOR 或 parity 观察信号描述成真实噪声、恒功耗或侧信道安全证明。',
      en:"Generate a complete Verilog-2005 module named csr_access_secure, adapted from the CSR access-control case in PowerSecV, Section IV.D, Figure 4(b).\n\nUse these ports:\n  input wire clk\n  input wire rst_n\n  input wire csr_we\n  input wire [1:0] current_priv\n  input wire [11:0] csr_addr\n  input wire [31:0] write_data\n  output wire [31:0] csr_rdata\n  output reg illegal_access\n  output wire power_signature\n\nPrimary secure implementation:\n1. Store 128 words of 32 bits in csr_mem[0:127]. The address index is csr_addr[6:0]. Permission is current_priv >= csr_addr[11:10]. Follow the paper's abstract address convention rather than treating this as a full RISC-V CSR decoder. An upstream decoder must ensure that addresses mapping to the same low-7-bit storage index cannot use inconsistent privilege requirements to bypass protection.\n2. rst_n is an active-low asynchronous reset. Clear the array, auxiliary register and illegal_access on reset. Reset behavior is an explicit completion of the abbreviated paper figure.\n3. At a rising edge with csr_we=1, write write_data to the indexed CSR only if permission is valid. A denied request must not write the array.\n4. illegal_access is a request-result pulse: set it to !is_valid when csr_we=1 and clear it otherwise.\n5. Update a 32-bit auxiliary register mask_0 on every write request, permitted or denied, with write_data XOR 32'hA3EF63B2. power_signature is the reduction XOR of mask_0.\n6. Provide a combinational read completion: csr_rdata is the indexed CSR when current permission is valid, otherwise zero. This read port is an explicit assumption because the paper figure does not show the complete interface.\n7. Use wire/reg and ordinary always blocks. Do not claim that a fixed XOR guarantees physical noise, constant power or side-channel resistance.\n\nOptional follow-up low-power variant (not part of the primary secure implementation):\nGenerate a separate module named csr_access_low_power using the same ports, following Figure 4(c)'s dummy-buffer and conditional array-update structure. On every request, capture write_data in dummy_0, the address in addr_q, permission in allow_q and request presence in pending_q. At the next rising edge, commit only pending_q && allow_q, using the buffered address and data from that same request. Permission is sampled at acceptance and remains valid for that transaction; mid-transaction permission revocation is outside this example's contract. Do not combine a previous dummy value with the current request's address or permission. This variant adds one clock cycle of write-commit latency. Use a conditional clock enable on the original clk, not a combinationally gated clock. power_signature observes reduction XOR of dummy_0 only.\n\nThe supplied reference files are paper-adapted illustrations for static comparison. They have not been compiled, simulated or physically evaluated.\n"},
    controls:[
      ['PAPER-CSR-ACCESS','未授权 CSR 写入','仅 current_priv >= csr_addr[11:10] 且 csr_we 成立时更新 csr_mem[csr_addr[6:0]]。','Unauthorized CSR write','Update csr_mem[csr_addr[6:0]] only for a write request with current_priv >= csr_addr[11:10].',['CWE-1262']],
      ['PAPER-CSR-DENIED','拒绝请求未显式报告','illegal_access 表示当前写请求的权限拒绝；拒绝时不更新主存储，非请求周期清零。','Denied request not reported','Pulse illegal_access for a denied write, keep the array unchanged for that request, and clear the flag when no request is present.',['CWE-1262']],
      ['PAPER-CSR-AUX','访问许可分支可能形成可区分的切换特征','按图 4(b)，每个合法或非法请求均更新 mask_0 为 write_data XOR 固定掩码。它只是辅助切换结构，重复数据不保证翻转，尚未证明侧信道抵抗。','Permission-dependent switching profile','Following Figure 4(b), update mask_0 with write_data XOR a fixed mask on every permitted or denied request. This is auxiliary switching structure; repeated data may not toggle and side-channel resistance is unproven.',['CWE-1300']],
      ['PAPER-CSR-RESET-READ','补全接口的初始化与读权限不明确','示例明确增加异步清零与权限受控的组合读；这些行为未在论文缩略图中完整给出，不能视为原始物理实现的复现。','Unspecified initialization and read access','Explicitly add asynchronous reset and a permission-controlled combinational read. These complete the abbreviated figure and are not a reproduction of its physical implementation.',['CWE-1262']]
    ],
    knowledge:[
      ['CWE-1262','Improper Access Control for Register Interface','CSR 寄存器接口应将地址访问条件与权限判定绑定。本文案例使用 current_priv >= csr_addr[11:10]，拒绝请求不写主存储，并显式报告拒绝。','Bind register-interface access to the relevant address and privilege. This case uses current_priv >= csr_addr[11:10], suppresses denied array writes, and reports denial.','Hardware-CWE snapshot / PowerSecV Figure 4'],
      ['CWE-1300','Improper Protection of Physical Side Channels','论文图 4 对比权限分支的物理切换泄漏：图 4(b)使用每请求辅助寄存器更新。该示例保留其结构，不把固定 XOR 当成随机噪声，也不宣称复现电流波形或恒功耗。','Figure 4 compares physical switching leakage across permission branches. Figure 4(b) updates an auxiliary register for every request. This adaptation preserves that structure without treating fixed XOR as random noise or claiming reproduced waveforms or constant power.','Hardware-CWE snapshot / PowerSecV Section IV.D, Figure 4(b), pp. 11-12']

  function create(route,language='zh',demoCase='regular'){
    if(!['secv','secfsm'].includes(route))throw new Error('Unknown demo mode.');
    if(!['regular','unreachable'].includes(demoCase)||route==='secv'&&demoCase!=='regular')throw new Error('Unknown demo case.');

    const result={route,route_label:item.name[en?'en':'zh'],file_name:item.file,code:item.code,security_report:controls,knowledge_used:hits,

    if(route==='secv')Object.assign(result.verification,{simulation:'not_run',power_validation:'not_run',equivalence:'not_run',source_type:'paper_adapted_reference',comparison_scope:'static_architectural_only',paper_reference:{title:'PowerSecV: LLM-Based Secure and Low-Power Verilog Generation via Hardware-CWE Knowledge Graph and Power Evolution',section:'IV.D',figure:'4(b)',pages:[11,12]}});

        risk:en?'MAINT is the single unreachable state':'MAINT 是唯一不可达状态',
        measure:en?'MAINT is unreachable from IDLE and exits to non-reset RUN, matching V5; its missing incoming edge also matches V4. These are one state and one combined functional change. Preserve MAINT in the original version; the repaired proposal explicitly assumes the unused state should be removed.':'MAINT 从 IDLE 不可达，且有到非复位状态 RUN 的出口，符合 V5；无入口性质也关联 V4。这是同一个状态、同一处合并功能修改。原版保留 MAINT；修正版明确采用删除未使用状态的演示假设。',
        location:{kind:'state',state:'MAINT'},evidence:[en?'Reset enters IDLE. No transition enters MAINT; MAINT transitions to RUN.':'复位进入 IDLE。没有转移进入 MAINT；MAINT 转移到 RUN。'],
        confirmation:{status:'confirmed',method:'curated_demo_fact',scope:'predefined_requirement_only',reason:en?'Preset graph fact, not a runtime analysis result.':'预置需求图事实，不是实时分析结果。'},
        version_handling:{[original]:en?'Preserve MAINT and its exit to RUN; the unreachable-state issue remains.':'保留 MAINT 及其到 RUN 的出口；该不可达状态问题未修复。',
          [repaired]:en?'Explicit demo assumption: remove unused MAINT and its branch; review the functional change.':'明确演示假设：删除未使用的 MAINT 及其分支；需确认功能变更。'}};
      const common=controls.map(control=>control.id);controls.push(functional);

        change_summary:[en?'Preserve the declared unreachable MAINT state and its exit to RUN; apply ordinary coding safeguards.':'保留声明的不可达 MAINT 状态及其到 RUN 的出口，应用常规安全编码措施。',note],
        addressed_findings:common,remaining_findings:[functional.id]},

    result.security_report.push(
      {id:'PAPER-CSR-TRANSACTION',finding_id:'PAPER-CSR-TRANSACTION',knowledge_ids:['POWERSECV-POWER-EVOLUTION'],category:'coding_constraint',status:'待验证',lines:[],risk:en?'Mismatched buffered data, address or permission':'流水线数据、地址或权限错配',measure:en?'Capture dummy_0, addr_q, allow_q and pending_q together; commit the same accepted transaction one cycle later. Authorization is sampled at acceptance and remains valid for that request; revocation during the transaction is outside this example contract.':'同时抓取 dummy_0、addr_q、allow_q 和 pending_q；下一拍提交同一已接收事务。授权在接收时采样并只用于该请求；本示例不包含事务中途撤销授权。'},

    return JSON.parse(JSON.stringify(sample));
  }

(function(){
  'use strict';
  const route=document.body.dataset.route;
  const initialCase=route==='secfsm'&&document.body.dataset.demoCase==='unreachable'?'unreachable':'regular';
  let language=location.hash==='#en'?'en':'zh';
  const records=[];
  const state={type:'state',route,language,busy:false,history:[],target:'',configured:false,
    output:null,submittedRequirement:'',requirement:HDLGenDemos.create(route,language,initialCase).requirement,
    demo:true,demoCase:initialCase,includeSource:false,written:false};
  function text(zh,en){return language==='en'?en:zh;}
  function normalize(value){return String(value||'').trim().replace(/\s+/g,' ');}
  function example(){return HDLGenDemos.create(route,language,state.demoCase);}
  function publish(message){
    window.dispatchEvent(new MessageEvent('message',{data:message||{...state,language,history:records.map((x,index)=>({index,label:x.requirement.slice(0,45)}))}}));
    document.getElementById('offlineTitle').textContent=text('离线演示 · 预置示例','Offline demo · Predefined example');
    document.getElementById('offlineDescription').textContent=text('无需安装环境或配置模型。选择功能并运行示例，查看代码、安全知识和安全报告。','No installation or model configuration. Choose a mode and run its example to explore code, knowledge, and the security report.');
    document.getElementById('modelState').textContent=text('本地预置示例 · 无模型调用','Local predefined example · No model calls');
    document.getElementById('generate').textContent=text('展示示例','Show example');
  }
  function showExample(demoCase=state.demoCase){
    if(!['regular','unreachable'].includes(demoCase)||route==='secv'&&demoCase!=='regular')return;
    state.demoCase=demoCase;
    const sample=example();Object.assign(state,{requirement:sample.requirement,submittedRequirement:sample.requirement,output:sample.output,demo:true});
    records.unshift({...sample,demoCase});records.splice(8);
    state.status=text('已展示预置示例；未调用模型或外部工具。','Predefined example displayed. No model or external tools were called.');
  }
  async function handle(message){
    if(message.route!==route)return;
    switch(message.type){
      case 'ready':state.status=text('点击“运行演示”即可查看当前功能示例。','Click Run demo to view the example for this mode.');break;
      case 'draft':state.requirement=message.requirement;return;
      case 'switchRoute':{
        const file={secv:'CSL_HDLGen-General-Demo.html',secfsm:'CSL_HDLGen-FSM-Demo.html'}[message.nextRoute];
        if(file)location.href=file+(language==='en'?'#en':'');return;
      }
      case 'setLanguage':{
        const oldSample=example();language=message.language==='en'?'en':'zh';
        if(normalize(state.requirement)===normalize(oldSample.requirement))state.requirement=example().requirement;
        state.status=text('离线演示；运行示例查看预置结果。','Offline demo. Run the example to view predefined results.');break;
      }
      case 'runDemo':showExample(message.demoCase||state.demoCase);break;
      case 'optimize':{
        const result=state.output&&state.output.result;
        if(route!=='secv'||result?.verification?.agent_mode!=='demo'||result.verification.demo_case!=='powersecv-csr'||result.low_power_applied)return;
        const sample=HDLGenDemos.optimize(language);
        Object.assign(state,{requirement:sample.requirement,submittedRequirement:sample.requirement,output:sample.output,demo:true,demoCase:'regular',written:false});
        records.unshift({...sample,demoCase:'regular'});records.splice(8);
        state.status=text('已展示论文低功耗参考版；仅静态对照，未测量功耗或验证侧信道。','Paper low-power reference displayed; static comparison only, with no power measurement or side-channel validation.');
        break;
      }
      case 'generate':{
        const matches=['zh','en'].some(lang=>normalize(message.requirement)===normalize(HDLGenDemos.create(route,lang,state.demoCase).requirement));

          state.requirement=message.requirement;

        }break;

      case 'new':Object.assign(state,{output:null,submittedRequirement:'',requirement:'',demo:true});state.status=text('点击“运行演示”加载固定示例。','Click Run demo to load the predefined example.');break;
      case 'history':{

      }
      case 'selectVariant':{
        const result=state.output&&state.output.result;
        const variant=result&&Array.isArray(result.variants)&&result.variants.find(item=>item.id===message.variantId);

        state.written=false;break;

      case 'copy':{

'use strict';
const vscode=acquireVsCodeApi(),$=id=>document.getElementById(id),route=document.body.dataset.route;
let language=document.body.dataset.language==='en'?'en':'zh';

}
function configLabels(){
  $('keyHelp').textContent=t(hasStoredKey?'已保存密钥；留空可保留，更换接口地址时需要重新填写。':'首次配置请填写 API Key。');
  $('apiKey').placeholder=t(hasStoredKey?'留空保留已有密钥':'输入 API Key');

function translate(){
  document.documentElement.lang=language==='en'?'en':'zh-CN';$('language').value=language;
  for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t(node.dataset.i18n);

  for(const node of document.querySelectorAll('[data-label]'))node.setAttribute('aria-label',t(node.dataset.label));

  $('intro').textContent=t(route==='secv'?'描述你的设计，生成代码，并查看安全措施与知识依据。':'描述状态、初态、转移条件，以及异常状态下的预期行为。');
  $('requirement').placeholder=t(route==='secv'?'描述接口、功能、时钟复位和安全约束…':'描述状态、初态、转移条件和异常处理…');

  $('runFsmUnreachable').hidden=route!=='secfsm';
  configLabels();

function savingConfig(busy){configBusy=busy;for(const id of ['endpoint','modelName','apiKey','configSave','settingsClose','settingsCancel'])$(id).disabled=busy;configLabels();}
function closeConfig(){
  if(configBusy)return;

  $('settings').disabled=Boolean(lastState?.busy);send('closeSettings');$('settings').focus();

$('settingsClose').onclick=closeConfig;$('settingsCancel').onclick=closeConfig;
$('modelForm').onsubmit=e=>{
  e.preventDefault();if(configBusy)return;

$('modelSettings').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeConfig();}};
const saveDraft=()=>send('draft',{requirement:$('requirement').value,demo:$('demo').checked,includeSource:$('include').checked});
$('requirement').oninput=saveDraft;$('demo').onchange=saveDraft;$('include').onchange=saveDraft;
$('mode').value=route;$('mode').onchange=()=>{saveDraft();send('switchRoute',{nextRoute:$('mode').value});};
$('language').onchange=()=>{saveDraft();send('setLanguage',{language:$('language').value});};
$('variantSelect').onchange=()=>send('selectVariant',{variantId:$('variantSelect').value});
for(const [id,type] of Object.entries({settings:'configure',new:'new',bind:'bind',cancel:'cancel',copy:'copy',save:'saveAs',preview:'preview',write:'write',power:'optimize'}))$(id).onclick=()=>send(type);
$('runDemo').onclick=()=>send('runDemo',{demoCase:'regular'});
$('runFsmUnreachable').onclick=()=>send('runDemo',{demoCase:'unreachable'});
$('help').onclick=()=>{if(!lastState?.busy&&!configIsOpen){autoGuideShown=true;guide?.show();}};
$('generate').onclick=()=>{saveDraft();send('generate',{requirement:$('requirement').value,demo:$('demo').checked,includeSource:$('include').checked});};
$('requirement').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!$('generate').disabled){e.preventDefault();$('generate').click();}};
function showHistory(show){$('historyDrawer').hidden=!show;$('historyToggle').setAttribute('aria-expanded',String(show));if(show)$('conversation').scrollTop=0;}
$('historyToggle').onclick=()=>showHistory($('historyDrawer').hidden);$('historyClose').onclick=()=>showHistory(false);
$('optionsToggle').onclick=()=>{$('options').hidden=!$('options').hidden;$('optionsToggle').setAttribute('aria-expanded',String(!$('options').hidden));};
function selectTab(id){currentTab=id;$('variantPicker').hidden=id!=='code'||!Array.isArray(lastState?.output?.result.variants)||lastState.output.result.variants.length<2;for(const button of document.querySelectorAll('[data-tab]')){const active=button.dataset.tab===id;button.classList.toggle('selected',active);button.setAttribute('aria-selected',String(active));}for(const panel of document.querySelectorAll('.panel'))panel.hidden=panel.id!==id;}
const tabButtons=[...document.querySelectorAll('[data-tab]')];
for(const [index,button] of tabButtons.entries()){button.onclick=()=>selectTab(button.dataset.tab);button.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=tabButtons[(index+(e.key==='ArrowRight'?1:tabButtons.length-1))%tabButtons.length];next.focus();selectTab(next.dataset.tab);}};}
function render(state){

  const languageChanged=state.language&&state.language!==language;
  if(languageChanged){language=state.language;translate();}
  if(typeof state.requirement==='string'){$('requirement').value=state.requirement;$('demo').checked=state.demo===true;$('include').checked=state.includeSource===true;}
  $('status').textContent=t(state.status||'正在连接…');$('statusRow').classList.toggle('working',Boolean(busy));
  let target=state.target||'';try{target=decodeURI(target);}catch{}
  $('target').textContent=target?target.split(/[\\/]/).pop():t('未绑定文件');$('target').title=target;$('target').classList.toggle('attached',Boolean(target));
  $('modelState').textContent=t(state.output?.result.verification.agent_mode==='demo'?'离线演示 · 无需配置':state.configured?'已配置模型':'未配置模型');
  $('welcome').hidden=ready;$('result').hidden=!ready;
  $('submitted').textContent=state.submittedRequirement||'';
  $('badge').textContent=t(state.output?.result.verification.agent_mode==='model'?'待验证草稿':'演示结果');
  const variants=Array.isArray(state.output?.result.variants)?state.output.result.variants:[];

  for(const variant of variants){if(!Object.hasOwn(variantNames,variant.id))continue;const option=document.createElement('option');option.value=variant.id;option.textContent=t(variantNames[variant.id]);$('variantSelect').append(option);}
  $('variantSelect').value=state.output?.result.selected_variant||'original_function_secure';$('variantSelect').disabled=Boolean(busy);
  $('variantPicker').hidden=currentTab!=='code'||variants.length<2;
  // Updating progress or language must not reset a user's code selection/scroll position.
  const fingerprint=ready?JSON.stringify(state.output):null;
  if(fingerprint!==lastOutput){HDLGenRender.code($('code'),state.output?.result.code||'',document);HDLGenRender.report($('report'),state.output,t,document);HDLGenRender.knowledge($('knowledge'),state.output,t,document);lastOutput=fingerprint;selectTab('code');}
  else if(languageChanged&&ready){HDLGenRender.report($('report'),state.output,t,document);HDLGenRender.knowledge($('knowledge'),state.output,t,document);}
  for(const id of ['generate','bind','settings','new','demo','include','requirement','runDemo','runFsmUnreachable'])$(id).disabled=Boolean(busy);
  $('settings').disabled=Boolean(busy)||configIsOpen;
  $('help').disabled=Boolean(busy)||configIsOpen;
  $('cancel').hidden=!busy;$('generate').hidden=Boolean(busy);
  for(const id of ['copy','save'])$(id).disabled=busy||!ready;
  $('preview').disabled=busy||!ready||!state.target;$('write').disabled=busy||!ready||!state.target||state.written;

  $('power').hidden=route!=='secv'||!ready;$('power').disabled=busy||(!paperPowerDemo&&state.output?.result.verification.agent_mode!=='model')||state.output?.result.low_power_applied;

window.addEventListener('message',event=>{
  const state=event.data;if(!state||state.route!==route)return;

    if(configIsOpen)return;
    if(guide?.isOpen()){guide.hide();if(lastState?.showOnboarding)autoGuideShown=false;}
    configIsOpen=true;hasStoredKey=state.config.hasKey;configErrorMessage='';savingConfig(false);
    $('endpoint').value=state.config.base_url||'';$('modelName').value=state.config.model||'';$('apiKey').value='';

    $('help').disabled=true;

  if(state.type==='modelConfigError'){configErrorMessage=state.error;savingConfig(false);}
  if(state.type==='modelConfigSaved'){savingConfig(false);closeConfig();}
});
translate();$('status').textContent=t('正在连接…');send('ready');
